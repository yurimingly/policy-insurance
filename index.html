 return '<div class="card"><h3>💸 미가입 시 예상 손실 시뮬레이션</h3><p class="xs mut" style="margin:0 0 8px">타사 "미보장 시 평균 손해액 제시" 모델을 정책보험에 적용</p>'+
 '<div class="row sp sm"><span>'+(unit?'사육 규모':'재배 면적')+'</span><b id="simAv"></b></div><input type="range" id="simA" min="'+(s.min||(unit?500:3))+'" max="'+(s.max||(unit?5000:40))+'" step="'+(s.step||(unit?50:1))+'" value="'+(unit?s.base:Math.round((S.farm==='farm'?s.base*100:s.base)))+'">'+
 '<div class="chips" style="margin:8px 0">'+s.sc.map(function(c,i){return '<button class="chip '+(i===S.sel.simSc?'on':'')+'" data-sc="'+i+'">'+c[0]+'</button>'}).join('')+'</div><div id="simOut"></div></div>';

function simCalc(){
 var f=F(),s=f.sim,a=+$('#simA').value,sc=s.sc[S.sel.simSc],unit=s.unit,val,lab;
 if(unit){val=a*s.price;lab=a.toLocaleString()+'두'}else if(S.farm==='farm'){lab=(a*100).toLocaleString()+'㎡';val=a*s.price/10}else{val=a/10*s.price;lab=(a/10).toFixed(1)+'ha'}
 var rate=sc[1]/100,loss=val*rate,self=f.self.me/100,pay=unit?loss*(1-self):Math.max(0,val*(rate-self)),prem=val*0.012,net=loss-pay+prem;
 $('#simAv').textContent=lab;
 var mx=Math.max(loss,1);
 $('#simOut').innerHTML='<div class="sm mut">보험가입금액(추정) '+won(val)+' · 피해율 '+sc[1]+'%</div>'+
 '<div class="hbar"><span>미가입</span><div class="bar"><i style="width:100%;background:var(--r4)"></i></div><span style="width:70px">'+won(loss)+'</span></div>'+
 '<div class="hbar"><span>가입 시</span><div class="bar"><i style="width:'+Math.max(2,net/mx*100)+'%;background:var(--r1)"></i></div><span style="width:70px">'+won(net)+'</span></div>'+
 '<div class="callout" style="margin-top:8px">가입 시 보험금 약 <b>'+won(pay)+'</b> 수령 → 실제 부담 <b>'+won(net)+'</b> (자기부담 '+f.self.me+'%, 농가부담 보험료 추정 포함)</div><p class="xs mut">※ 정부·지자체 보험료 지원(약 50~80%) 반영 가정, 데모 계산식</p>';
}
