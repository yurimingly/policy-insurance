<script>
/* =========================================================
   정책보험 AI 프로토타입 · 모든 수치는 가상(데모) 데이터
   ========================================================= */
var S={farm:'apple',consent:{svc:true,pers:false,myd:false},checks:{},sel:{day:2,sigun:9,region:4,level:'macro',dkw:'',ocrStep:0,simArea:12,simSc:1}};
try{var sv=JSON.parse(localStorage.getItem('pai')||'null');if(sv){S.farm=sv.farm||S.farm;S.consent=sv.consent||S.consent;S.checks=sv.checks||{};S.onb=sv.onb;S.mine=sv.mine||null;S.user=sv.user||null;S.cases=sv.cases||[];S.rules=sv.rules||[];S.audit=sv.audit||[];S.claimSent=sv.claimSent||{};S.ext=sv.ext||null;if(S.mine)S.farm=sv.farm||'mine'}}catch(e){}
function save(){try{localStorage.setItem('pai',JSON.stringify({farm:S.farm,consent:S.consent,checks:S.checks,onb:S.onb,mine:S.mine,user:S.user,cases:S.cases,rules:S.rules,audit:S.audit,claimSent:S.claimSent,ext:S.ext}))}catch(e){}}
function $(s){return document.querySelector(s)}function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function won(v){return v>=10000?(v/10000).toFixed(v%10000?1:0)+'억 원':Math.round(v).toLocaleString()+'만 원'}
function col(v){return v>=80?'var(--r4)':v>=65?'var(--r3)':v>=45?'var(--r2)':'var(--r1)'}
function lvl(v){return v>=80?'심각':v>=65?'경계':v>=45?'주의':'관심'}
